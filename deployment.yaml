apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-country-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-country-service
  template:
    metadata:
      labels:
        app: my-country-service
    spec:
      containers:
        - name: my-country-service
          image: sayubb/my-country-service:IMAGE_TAG
          ports:
            - containerPort: 8082