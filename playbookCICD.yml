---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local

  vars_files:
    - vault.yml

  vars:
    image_name: my-country-service
	image_tag: "{{ build_number | default('latest') }}"
    dockerfile_path: './'
    docker_registry_username: "sayubb"

  tasks:
    - name: Log in to Docker Hub
      community.general.docker_login:
        username: "{{ docker_registry_username }}"
        password: "{{ docker_registry_password }}"
        reauthorize: yes
      no_log: true

    - name: Build Docker image
      docker_image:
        build:
          path: "{{ dockerfile_path }}"
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        state: present

    - name: Push the Docker image to Docker Hub
      docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        push: yes
        source: local

    - name: Pull Docker image (optional)
      docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        source: pull

	- name: Apply Kubernetes Deployment
	  kubernetes.core.k8s:
	    state: present
	    namespace: jenkins
	    src: deployment.yaml
	    kubeconfig: "{{ kubeconfig_path }}"
	    request_timeout: 30

	- name: Apply Kubernetes Service
	  kubernetes.core.k8s:
	    state: present
	    namespace: jenkins
	    src: service.yaml
	    kubeconfig: "{{ kubeconfig_path }}"
	    request_timeout: 30